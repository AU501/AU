<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluador de Condición — Auditoría de TI</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f0;--bg3:#eeedea;
  --text:#1a1a18;--text2:#6b6a65;--text3:#9a9992;
  --border:rgba(0,0,0,0.11);--border2:rgba(0,0,0,0.20);
  --purple:#7F77DD;--purple-l:#EEEDFE;--purple-d:#3C3489;
  --green-l:#EAF3DE;--green:#3B6D11;--green-d:#27500A;
  --amber-l:#FAEEDA;--amber:#854F0B;--amber-d:#633806;
  --red-l:#FCEBEB;--red:#A32D2D;--red-d:#791F1F;
  --teal-l:#E1F5EE;--teal:#0F6E56;
  --r-md:8px;--r-lg:12px;
  --font:system-ui,-apple-system,sans-serif;
  --mono:'Courier New',monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1c1c1a;--bg2:#242420;--bg3:#2a2a26;
  --text:#f0efe8;--text2:#a0a098;--text3:#6a6a62;
  --border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.18);
}}
body{font-family:var(--font);background:var(--bg3);min-height:100vh;padding:1.5rem 1rem;color:var(--text)}
.wrap{max-width:740px;margin:0 auto}

/* API key banner */
.api-banner{background:var(--amber-l);border:0.5px solid #EF9F27;border-radius:var(--r-md);padding:.85rem 1rem;margin-bottom:1.25rem;display:flex;align-items:flex-start;gap:10px}
.api-banner i{font-size:18px;color:var(--amber-d);flex-shrink:0;margin-top:1px}
.api-banner-text{font-size:13px;color:var(--amber-d);line-height:1.6}
.api-banner input{width:100%;margin-top:6px;padding:.55rem .85rem;border:0.5px solid #EF9F27;border-radius:var(--r-md);font-size:13px;color:var(--text);background:var(--bg);font-family:var(--mono)}
.api-banner input:focus{outline:none;border-color:var(--amber)}

/* tabs */
.tabs{display:flex;border:0.5px solid var(--border2);border-radius:var(--r-md);overflow:hidden;margin-bottom:1.5rem}
.tab{flex:1;padding:.65rem 1rem;font-size:14px;font-weight:500;cursor:pointer;border:none;background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--font)}
.tab.active{background:var(--purple-l);color:var(--purple-d)}
.tab:first-child{border-right:0.5px solid var(--border2)}

/* cards */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:1.3rem 1.4rem;margin-bottom:1rem}
.section-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:8px}
.section-title i{font-size:17px;color:var(--purple-d)}

/* form fields */
.field{margin-bottom:.9rem}
.field-lbl{font-size:13px;font-weight:500;color:var(--text);margin-bottom:.35rem;display:block}
.field-sub{font-size:12px;color:var(--text2);margin-bottom:.5rem;line-height:1.5}
input[type=text],select{width:100%;padding:.65rem .9rem;border:0.5px solid var(--border2);border-radius:var(--r-md);font-size:14px;color:var(--text);background:var(--bg);font-family:var(--font)}
input[type=text]:focus,select:focus{outline:none;border-color:var(--purple)}
textarea{width:100%;padding:.75rem .9rem;border:0.5px solid var(--border2);border-radius:var(--r-md);font-size:13px;color:var(--text);background:var(--bg);resize:vertical;line-height:1.65;font-family:var(--mono)}
textarea.plain{font-family:var(--font);font-size:14px}
textarea:focus{outline:none;border-color:var(--purple)}
textarea:disabled{opacity:.6;cursor:default}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:500px){.two-col{grid-template-columns:1fr}}
hr{border:none;border-top:0.5px solid var(--border);margin:1rem 0}

/* badges */
.badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
.b-alto{background:var(--red-l);color:var(--red-d)}
.b-medio{background:var(--amber-l);color:var(--amber-d)}
.b-bajo{background:var(--green-l);color:var(--green-d)}
.b-fw{background:var(--purple-l);color:var(--purple-d)}

/* buttons */
.arow{display:flex;gap:8px;flex-wrap:wrap;margin-top:.9rem}
.btn-p{padding:.65rem 1.3rem;border-radius:var(--r-md);border:0.5px solid var(--purple);background:var(--purple-l);color:var(--purple-d);font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font)}
.btn-p:hover{background:#CECBF6}
.btn-p:disabled{opacity:.4;cursor:not-allowed}
.btn-s{padding:.65rem 1.3rem;border-radius:var(--r-md);border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);font-size:14px;cursor:pointer;font-family:var(--font)}
.btn-s:hover{background:var(--bg2)}

/* evidence */
.ev-lbl{font-size:11px;font-weight:500;color:#534AB7;letter-spacing:.04em;margin-bottom:5px;text-transform:uppercase}
.ev-box{background:var(--bg2);border-left:3px solid var(--purple);border-radius:0 var(--r-md) var(--r-md) 0;padding:.85rem 1rem;font-size:12.5px;font-family:var(--mono);line-height:1.8;color:var(--text);white-space:pre-wrap;margin-bottom:1rem;overflow-x:auto}
.tip-box{background:var(--purple-l);border-radius:var(--r-md);padding:.7rem 1rem;margin-bottom:.9rem;font-size:13px;color:var(--purple-d);line-height:1.6}

/* char row */
.char-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text3);margin-top:4px;margin-bottom:.75rem}

/* feedback */
.fb-banner{border-radius:var(--r-md);padding:.9rem 1.1rem;margin-bottom:.85rem;display:flex;align-items:center;gap:12px}
.fb-Excelente{background:var(--green-l);border:0.5px solid #97C459}
.fb-Buena{background:var(--teal-l);border:0.5px solid #5DCAA5}
.fb-Mejorable{background:var(--amber-l);border:0.5px solid #EF9F27}
.fb-Insuficiente{background:var(--red-l);border:0.5px solid #F09595}
.fb-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fb-Excelente .fb-ic{background:#C0DD97} .fb-Excelente .fb-ic i{color:var(--green-d)}
.fb-Buena .fb-ic{background:#9FE1CB} .fb-Buena .fb-ic i{color:var(--teal)}
.fb-Mejorable .fb-ic{background:#FAC775} .fb-Mejorable .fb-ic i{color:var(--amber-d)}
.fb-Insuficiente .fb-ic{background:#F7C1C1} .fb-Insuficiente .fb-ic i{color:var(--red-d)}
.fb-nivel{font-size:15px;font-weight:500}
.fb-Excelente .fb-nivel{color:var(--green-d)} .fb-Buena .fb-nivel{color:var(--teal)}
.fb-Mejorable .fb-nivel{color:var(--amber-d)} .fb-Insuficiente .fb-nivel{color:var(--red-d)}
.fb-sub{font-size:12px;color:var(--text2);margin-top:2px}
.fb-body{font-size:13px;line-height:1.75;color:var(--text);background:var(--bg2);border-radius:var(--r-md);padding:.85rem 1rem;margin-bottom:.85rem}
.ideal-card{background:var(--bg2);border-radius:var(--r-md);padding:.85rem 1rem;border-left:3px solid var(--purple);margin-bottom:.85rem}
.ideal-lbl{font-size:11px;font-weight:500;color:#534AB7;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}
.ideal-text{font-size:13px;color:var(--text);line-height:1.7}

/* empty state */
.empty{text-align:center;padding:2.5rem 1rem}
.empty i{font-size:36px;color:var(--text3);margin-bottom:.75rem;display:block}
.empty p{font-size:14px;color:var(--text2);margin-bottom:1rem}

/* error */
.err-msg{display:none;background:var(--red-l);border-radius:var(--r-md);padding:.6rem .9rem;font-size:13px;color:var(--red);margin-top:.75rem}

/* loading */
.ldots span{animation:bk 1.2s infinite;display:inline-block}
.ldots span:nth-child(2){animation-delay:.2s}
.ldots span:nth-child(3){animation-delay:.4s}
@keyframes bk{0%,80%,100%{opacity:0}40%{opacity:1}}

footer{text-align:center;font-size:12px;color:var(--text3);margin-top:2rem;padding-bottom:1rem}
</style>
</head>
<body>
<div class="wrap">

  <!-- API Key -->
  <div class="api-banner">
    <i class="ti ti-key"></i>
    <div class="api-banner-text">
      <strong>API Key de Anthropic requerida</strong> — La evaluación usa Claude para dar retroalimentación personalizada.
      Consiga su key gratis en <strong>console.anthropic.com</strong> → API Keys.
      <input type="password" id="apikey" placeholder="sk-ant-api03-..." autocomplete="off">
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-prof" onclick="setMode('profesor')">
      <i class="ti ti-school"></i> Modo profesor
    </button>
    <button class="tab" id="tab-est" onclick="setMode('estudiante')">
      <i class="ti ti-pencil"></i> Modo estudiante
    </button>
  </div>

  <div id="main"></div>

  <footer>Auditoría de TI · Evaluación con IA · Uso educativo</footer>
</div>

<script>
let mode = 'profesor';
let caso = {
  titulo:'', dominio:'', riesgo:'medio', framework:'',
  contexto:'', evidencia:'', condicionIdeal:'', listo:false
};
let est = { respuesta:'', feedback:null, loading:false, intentos:0 };

function getKey(){ return (document.getElementById('apikey')||{value:''}).value.trim(); }
function setMode(m){
  mode=m;
  document.getElementById('tab-prof').className='tab'+(m==='profesor'?' active':'');
  document.getElementById('tab-est').className='tab'+(m==='estudiante'?' active':'');
  render();
}
function $(id){ return document.getElementById(id); }
function esc(s){
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function wc(t){ return t.split(/\s+/).filter(w=>w).length; }

/* ── PROFESOR ── */
function leerCampos(){
  caso.titulo     = ($('f-titulo')||{value:''}).value;
  caso.dominio    = ($('f-dominio')||{value:''}).value;
  caso.riesgo     = ($('f-riesgo')||{value:'medio'}).value;
  caso.framework  = ($('f-fw')||{value:''}).value;
  caso.contexto   = ($('f-contexto')||{value:''}).value;
  caso.evidencia  = ($('f-evidencia')||{value:''}).value;
  caso.condicionIdeal = ($('f-ideal')||{value:''}).value;
}
function activar(){
  leerCampos();
  if(!caso.titulo.trim()||!caso.contexto.trim()||!caso.evidencia.trim()){
    const e=$('err-prof'); if(e) e.style.display='block';
    setTimeout(()=>{ const e=$('err-prof'); if(e) e.style.display='none'; },2500);
    return;
  }
  caso.listo=true;
  est={respuesta:'',feedback:null,loading:false,intentos:0};
  setMode('estudiante');
}

function renderProfesor(){
  const rOpts=['alto','medio','bajo'].map(r=>
    `<option value="${r}"${caso.riesgo===r?' selected':''}>${r.charAt(0).toUpperCase()+r.slice(1)}</option>`
  ).join('');

  $('main').innerHTML=`
  <div class="card">
    <div class="section-title"><i class="ti ti-settings"></i>Configurar el caso</div>

    <div class="field">
      <label class="field-lbl">Título del caso</label>
      <input type="text" id="f-titulo" placeholder="Ej: Usuarios desvinculados con acceso activo al ERP" value="${esc(caso.titulo)}" oninput="caso.titulo=this.value">
    </div>

    <div class="two-col">
      <div class="field">
        <label class="field-lbl">Dominio de auditoría</label>
        <input type="text" id="f-dominio" placeholder="Ej: Gestión de accesos" value="${esc(caso.dominio)}" oninput="caso.dominio=this.value">
      </div>
      <div class="field">
        <label class="field-lbl">Marco de referencia</label>
        <input type="text" id="f-fw" placeholder="Ej: ISO 27001 A.5.18" value="${esc(caso.framework)}" oninput="caso.framework=this.value">
      </div>
    </div>

    <div class="field">
      <label class="field-lbl">Nivel de riesgo</label>
      <select id="f-riesgo" onchange="caso.riesgo=this.value">${rOpts}</select>
    </div>

    <hr>

    <div class="field">
      <label class="field-lbl">Contexto del caso</label>
      <span class="field-sub">Situación que el estudiante leerá antes de ver la evidencia. ¿Qué empresa? ¿Qué revisó el auditor? ¿Qué período?</span>
      <textarea class="plain" id="f-contexto" rows="3"
        placeholder="Ej: Eres auditor de TI en una empresa de logística. Durante enero 2024 cruzaste la nómina activa contra la matriz de accesos del sistema ERP de producción...">${esc(caso.contexto)}</textarea>
    </div>

    <div class="field">
      <label class="field-lbl">Evidencia</label>
      <span class="field-sub">Pegue el log, tabla, reporte o extracto que el estudiante debe analizar. Use espacios para alinear columnas si es necesario.</span>
      <textarea id="f-evidencia" rows="10"
        placeholder="CRUCE NÓMINA vs ACCESOS ERP — ENERO 2024&#10;Usuario    Estado     Acceso ERP   Último acceso&#10;---------  ---------  ----------   --------------------&#10;usr_003    INACTIVA   SÍ           2024-01-22  19:14&#10;usr_005    INACTIVA   SÍ           2024-01-27  22:41">${esc(caso.evidencia)}</textarea>
    </div>

    <hr>

    <div class="field">
      <label class="field-lbl">Condición ideal <span style="font-weight:400;color:var(--text2)">(opcional pero recomendado)</span></label>
      <span class="field-sub">La condición que usted considera correcta. La IA la usará como referencia para evaluar al estudiante y mostrarla si la respuesta es Mejorable o Insuficiente.</span>
      <textarea class="plain" id="f-ideal" rows="3"
        placeholder="Ej: Se identificaron 4 usuarios con estado INACTIVA en nómina que mantienen acceso activo al sistema ERP, representando el 80% de los usuarios revisados, con acceso registrado hasta el 29 de enero de 2024.">${esc(caso.condicionIdeal)}</textarea>
    </div>

    <div class="err-msg" id="err-prof">Complete al menos el título, el contexto y la evidencia para continuar.</div>

    <div class="arow">
      <button class="btn-p" onclick="activar()">
        <i class="ti ti-player-play" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>
        Activar caso para estudiantes
      </button>
      ${caso.listo?`<button class="btn-s" onclick="setMode('estudiante')">Ver modo estudiante</button>`:''}
    </div>
  </div>`;
}

/* ── ESTUDIANTE ── */
function renderEstudiante(){
  if(!caso.listo){
    $('main').innerHTML=`
    <div class="card">
      <div class="empty">
        <i class="ti ti-lock"></i>
        <p>El profesor aún no ha configurado ningún caso.</p>
        <button class="btn-p" onclick="setMode('profesor')">Ir al modo profesor</button>
      </div>
    </div>`;
    return;
  }

  const riskCls='b-'+caso.riesgo;
  const riskLbl=caso.riesgo==='alto'?'🔴 Riesgo alto':caso.riesgo==='medio'?'🟡 Riesgo medio':'🟢 Riesgo bajo';
  const answered=est.feedback!==null;
  const fb=est.feedback;
  const ans=est.respuesta||'';

  let fbHTML='';
  if(fb){
    const lvl=fb.nivel;
    const icon=lvl==='Excelente'?'ti-award':lvl==='Buena'?'ti-circle-check':lvl==='Mejorable'?'ti-alert-triangle':'ti-circle-x';
    fbHTML=`
    <div style="margin-top:1rem">
      <div class="fb-banner fb-${lvl}">
        <div class="fb-ic"><i class="ti ${icon}"></i></div>
        <div>
          <div class="fb-nivel">${lvl}</div>
          <div class="fb-sub">Intento ${est.intentos}</div>
        </div>
      </div>
      <div class="fb-body">${(fb.texto||'').replace(/\n/g,'<br>')}</div>
      ${fb.mostrarIdeal&&caso.condicionIdeal?`
      <div class="ideal-card">
        <div class="ideal-lbl">Condición de referencia del profesor</div>
        <div class="ideal-text">${esc(caso.condicionIdeal)}</div>
      </div>`:''}
    </div>`;
  }

  let actHTML='<div class="arow">';
  if(!answered){
    actHTML+=`<button class="btn-p" id="btn-eval" onclick="evaluar()" ${est.loading?'disabled':''}>
      ${est.loading
        ?'<span class="ldots">Evaluando<span>.</span><span>.</span><span>.</span></span>'
        :'Evaluar mi condición'}
    </button>`;
  } else {
    if(fb&&fb.nivel!=='Excelente'){
      actHTML+=`<button class="btn-s" onclick="reintentar()">
        <i class="ti ti-refresh" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Intentar de nuevo
      </button>`;
    }
    actHTML+=`<button class="btn-s" onclick="setMode('profesor')">
      <i class="ti ti-settings" style="font-size:13px;vertical-align:-2px;margin-right:4px"></i>Cambiar caso
    </button>`;
  }
  actHTML+='</div>';

  $('main').innerHTML=`
  <div class="card">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.55rem">
      <span class="badge ${riskCls}">${riskLbl}</span>
      ${caso.framework?`<span class="badge b-fw"><i class="ti ti-book" style="font-size:11px"></i> ${esc(caso.framework)}</span>`:''}
    </div>
    ${caso.dominio?`<div style="font-size:12px;color:var(--text2);margin-bottom:5px">${esc(caso.dominio)}</div>`:''}
    <div style="font-size:17px;font-weight:500;color:var(--text);margin-bottom:.5rem">${esc(caso.titulo)}</div>
    <div style="font-size:13px;color:var(--text2);line-height:1.65;margin-bottom:1rem">${esc(caso.contexto)}</div>

    <div class="ev-lbl"><i class="ti ti-file-search" style="font-size:12px;vertical-align:-1px;margin-right:4px"></i>Evidencia</div>
    <div class="ev-box">${esc(caso.evidencia)}</div>

    <div class="tip-box">
      <i class="ti ti-info-circle" style="font-size:14px;vertical-align:-2px;margin-right:5px"></i>
      <strong>Recuerda:</strong> La condición describe QUÉ se encontró — hechos objetivos, en tiempo pasado, cuantificados, sin causas ni recomendaciones.
    </div>

    <label class="field-lbl" style="margin-bottom:.35rem">Redacta la condición del hallazgo:</label>
    <div style="font-size:12px;color:var(--text2);margin-bottom:.55rem">2–4 oraciones · tiempo pasado · solo hechos objetivos y cuantificados</div>
    <textarea class="plain" id="ta" rows="5"
      placeholder="Se identificaron / Se verificó que..."
      ${answered?'disabled':''}
      oninput="est.respuesta=this.value;updChar()">${esc(ans)}</textarea>
    <div class="char-row">
      <span id="cc">${ans.length} caracteres</span>
      <span id="ww">${wc(ans)} palabras</span>
    </div>

    ${actHTML}
    ${fbHTML}
  </div>`;
}

function updChar(){
  const ta=$('ta'); if(!ta) return;
  const v=ta.value;
  est.respuesta=v;
  const cc=$('cc'); if(cc) cc.textContent=v.length+' caracteres';
  const ww=$('ww'); if(ww) ww.textContent=wc(v)+' palabras';
}

function reintentar(){
  est.respuesta='';est.feedback=null;
  render();
}

async function evaluar(){
  const ans=est.respuesta||'';
  if(ans.trim().length<15){
    const ta=$('ta');
    if(ta){ta.style.borderColor='#E24B4A';setTimeout(()=>ta.style.borderColor='',1500);}
    return;
  }
  const key=getKey();
  if(!key){
    alert('Ingresa tu API key de Anthropic en el campo de arriba para evaluar.');
    return;
  }
  est.loading=true;
  est.intentos++;
  render();

  const idealRef=caso.condicionIdeal.trim()
    ?`\n\nCONDICIÓN IDEAL DEL PROFESOR (referencia):\n"${caso.condicionIdeal}"`
    :'\n\n(El profesor no proporcionó condición ideal. Evalúa con criterios formales de auditoría de TI.)';

  const prompt=`Eres un auditor senior de TI evaluando la CONDICIÓN de un hallazgo redactada por un estudiante de auditoría informática.

CASO: ${caso.titulo}
${caso.dominio?'DOMINIO: '+caso.dominio:''}
${caso.framework?'MARCO: '+caso.framework:''}
RIESGO: ${caso.riesgo}

CONTEXTO:
${caso.contexto}

EVIDENCIA:
${caso.evidencia}
${idealRef}

CONDICIÓN DEL ESTUDIANTE:
"${ans}"

Evalúa con estos criterios formales:
1. ¿Describe hechos objetivos basados en la evidencia (no opiniones)?
2. ¿Está en tiempo pasado ("se identificaron", "se verificó")?
3. ¿Está cuantificada (números, porcentajes, fechas concretas)?
4. ¿Menciona el sistema o proceso auditado?
5. ¿Evita causas, efectos o recomendaciones?
${caso.condicionIdeal?'6. ¿Se aproxima a la condición ideal del profesor?':''}

Niveles:
- Excelente: cumple todos los criterios, lenguaje profesional
- Buena: cumple la mayoría, ajustes menores
- Mejorable: cumple algunos, errores significativos
- Insuficiente: no cumple criterios básicos

Responde SOLO con este JSON sin markdown ni texto adicional:
{"nivel":"Excelente|Buena|Mejorable|Insuficiente","texto":"retroalimentación de 3-5 oraciones: qué está bien, qué falta y cómo mejorar. Sé específico usando datos de la evidencia.","mostrarIdeal":true|false}

mostrarIdeal=true solo si nivel es Mejorable o Insuficiente. Responde en español formal.`;

  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:1000,
        messages:[{role:'user',content:prompt}]
      })
    });
    const data=await resp.json();
    if(data.error) throw new Error(data.error.message);
    const raw=data.content?.map(b=>b.text||'').join('').trim()||'{}';
    est.feedback=JSON.parse(raw.replace(/```json|```/g,'').trim());
  }catch(e){
    est.feedback={
      nivel:'Mejorable',
      texto:'No se pudo conectar con el evaluador ('+e.message+'). Verifica tu API key. Mientras tanto, revisa que tu condición incluya: hechos objetivos, números concretos, tiempo pasado y el nombre del sistema. Evita incluir causas o recomendaciones.',
      mostrarIdeal:true
    };
  }
  est.loading=false;
  render();
}

function render(){
  if(mode==='profesor') renderProfesor();
  else renderEstudiante();
}

render();
</script>
</body>
</html>
